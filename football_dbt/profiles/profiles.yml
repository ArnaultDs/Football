# football_dbt/profiles/profiles.yml
football_dbt:                  # doit correspondre à profile: dans dbt_project.yml
  target: prod
  outputs:
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"           
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"               
      user: "{{ env_var('POSTGRES_USER') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 4