[project]
name = "football"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "requests>=2",
    "sqlalchemy>=2",
    "alembic",
    "dbt-core~=1.11.0",
    "dbt-postgres~=1.11.0",
]

[dependency-groups]
dev = ["apache-airflow==3.3.0"]   # même version que l'image

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
